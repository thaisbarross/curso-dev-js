<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de repetições</title>
</head>
<body>

    <p>F12 para Visualizar!</p>

    <script>

        const nomes = ["Lucas", "Maria", "José", "Ana", "Paulo"];
        const numeros = [10,20,30,40,50];
        const alunos = [
            {nome : "Lucas", nota : 9},
            {nome : "Maria", nota : 10},
            {nome : "Pedro", nota : 8.5},
        ]

        // FOR (VARIAVEL, CONDICICAO, INCREMENTO)
        for (let i = 1; i <= 10; i++)
        {
            console.log(i);
        }

        for (let i = 1; i < nomes.length; i++){
            console.log(nomes[i]);
        }

        // WHILE E DO WHILE
        // WHILE (CONDIÇÃO FOR VERDADEIRA)

        let x = 1;
        while (x <= 10){
            console.log(x);
            x++;
            if (x === 4){
                continue;
            }
            if(x === 5){
                break;
            }
        }

        do{
            console.log(x);
            x++;
        } while(x <= 10);

        //FOREACH

        nomes.forEach(function(nome){
            console.log(nome);
        });

        nomes.forEach(function(aluno){
            console.log(aluno.nota);
        }); 

        // MAP
        // NUMEROS = [10,20,30,40,50];
        // NOVOARRAY = [20,40,60,80,100];
        novoArray = []
        for (let i = 0; i< numeros.length; i++){
            novoArray.push(numeros[i]*2);
        }
        console.log(novoArray);

        const novoArray2 = numeros.map(function(numero){
            return numero * 2;
        });
        console.log(novoArray2)

    </script>
    
</body>
</html>
