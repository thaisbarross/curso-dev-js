<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplos</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 10px;
            padding: 0;
            background-color: darkgrey;
        }

        h1, h2{
            text-align: center;
        }

        h1{
            color: #3498db;
            /* text-align: center; */
            font-size: 36px;
        }

        h2{
            /* text-align: center; */
        }

        p{
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            margin: 10px 0;
        }

        .box{
            background-color: aquamarine;
            color: white;
            padding: 20px;
            margin: 10px;
            border-radius: 8px;
        }

        #info{
            text-align: center;
            font-size: 14px;
            padding: 10px;
            margin-top: 20px;
            background-color: cadetblue;
        }

        table{
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td{
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th{
            background-color: aliceblue;
            color: black;
        }

        .border-exemplo{
            margin: 20px;
            padding: 15px;
            border: 3px solid rgb(226, 129, 226);
        }

        ul{
            list-style-type: square;
        }

        li{
            margin-bottom: 15px;
        }

        img{
            border-radius: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    
<h1>exemplos básicos de css</h1>

<p>exemplo de parágrafo</p>

<div class="box">
    <p>exemplo de um parágrafo dentro da div com classe box</p>
</div>

<div id="info">
    <p>exemplo de um parágrafo dentro da div com com id info</p>
</div>

<h2>tabela de exemplos</h2>
<!-- table>tr>th*3 -->
<table>
    <tr>
        <th>nome</th>
        <th>idade</th>
        <th>cidade</th>
    </tr>
    <tr>
 <!-- tr>td*3 -->
        <td>thaís</td>
        <td>28</td>
        <td>presidente prudente</td>
    </tr>

</table>

<div class="border-exemplo">
    <p>div com borda</p>
</div>

<h2>listas</h2>
<!-- ul>li{item $}*3 -->
<ul>
    <li>item 1</li>
    <li>item 2</li>
    <li>item 3</li>
</ul>

<h2>exemplo de imagem</h2>
<img src="https://picsum.photos/600/300" alt="imagem de exemplo">

</body>
</html>
