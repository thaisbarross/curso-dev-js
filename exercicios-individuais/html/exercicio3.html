<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Horários</title>
</head>
<body>
    <header>
        <h1>Tabela de Horários</h1>
        <hr>
    </header>
    <section>
        <table>
            <thead>
                <tr>
                    <th>Dia</th>
                    <th>Horário</th>
                    <th>Atividade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Segunda</td>
                    <td>07:00</td>
                    <td>Saída do terminal central</td>
                </tr>
                <tr>
                    <td>Terça</td>
                    <td>12:30</td>
                    <td>Parada para almoço em rota</td>
                </tr>
                <tr>
                    <td>Quarta</td>
                    <td>15:00</td>
                    <td>Chegada ao ponto final</td>
                </tr>
                <tr>
                    <td>Quinta</td>
                    <td>09:45</td>
                    <td>Inspeção de manutenção</td>
                </tr>
                <tr>
                    <td>Sexta</td>
                    <td>18:00</td>
                    <td>Retorno ao terminal central</td>
                </tr>
                
            </tbody>
        </table>
    </section>
    
</body>
</html>
