<body>
    
    <p>aperte o f12 para ver o resultado!</p>

    <script>

        function exercicio1 (){
            //operadores aritméticos básicos + - / *
            const numero1 = Number (prompt ("digite o primeiro número:"));
            const numero2 = Number (prompt ("digite o segundo número:"));
            console.log (numero1 + numero2);
            console.log (numero1 - numero2);
            console.log (numero1 / numero2);
            console.log (numero1 * numero2);
        }

       // exercicio1 ();

       function exercicio2 (){
        const numero = Number(prompt("Digite o primeiro número:"));
        console.log ("Sucessor do número é:", numero + 1, numero - 1);
        }

       // exercicio2 ();

       function exercicio3 (){
        const numero = Number(prompt("Quanto você tem em dinheiro?:"));
        console.log ("Você tem em dólar:", (numero / 5.35).toFixed(2));
       }
       //exercicio3 ();

       function exercicio4 (){
        const peso = Number(prompt ("peso:"));
        const altura = Number(prompt ("altura:"));
        constimc = peso / altura ** 2; //altura * altura
        console.log (imc.toFixed(2));
       }
       //exercicio4 ();



    </script>
